<title>Motifs Galactic RGY-140</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
/* Layout : grille de cartes "écran de projection" ; un seul thème sombre, comme une salle avec le laser allumé. */
:root {
  --bg: #121318;
  --panel: #1b1d24;
  --screen: #0a0b0f;
  --line: #2a2d37;
  --fg: #e6e8ee;
  --muted: #8d93a3;
  --beam: #46e65a;
  --display: "Chakra Petch", "Segoe UI", system-ui, sans-serif;
  --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
body {
  background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 40px;
}
main { max-width: 1100px; margin: 0 auto; display: grid; gap: 20px; }
h1 { font-family: var(--display); font-weight: 600; font-size: 1.6rem; margin: 0; letter-spacing: .02em; text-wrap: balance; }
p { margin: 0; color: var(--muted); max-width: 65ch; line-height: 1.5; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.card {
  display: grid; grid-template-columns: 2.2rem 64px 1fr; align-items: center; gap: 12px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 8px 12px 8px 10px;
}
.num { font-family: var(--display); font-weight: 600; font-size: 1.15rem; color: var(--beam); text-align: right; font-variant-numeric: tabular-nums; }
canvas { width: 64px; height: 52px; background: var(--screen); border-radius: 4px; display: block; }
.name { font-size: .92rem; line-height: 1.3; min-width: 0; }
.dmx { display: block; font-size: .75rem; color: var(--muted); font-variant-numeric: tabular-nums; margin-top: 2px; }
</style>

<main>
  <header style="display:grid;gap:8px">
    <h1>Motifs du laser Galactic RGY-140 (canal 2)</h1>
    <p>Croquis tracés d'après tes descriptions. Dis-moi les numéros à corriger, puis je les mettrai dans l'appli entre le numéro et le texte.</p>
  </header>
  <section class="grid" id="grid"></section>
</main>

<script>
const names = ["cercle","cercle pointillé","triangle","carré","carré pointillé","double carré","grosse croix","étoile",
"L","sablier renversé","tourbillon","2 C inversés","courbe bizarre","2 quarts de cercle","double vague","grande vague",
"montagne","W","E","ligne","ligne pointillée","ligne","double ligne horizontale","croix en ligne",
"2 traits","cercle coupé","2 petits carrés","4 carrés dans les coins",
"rond en haut à droite","pointillé rapide","petite courbe pointillée rapide","X pointillé"];

const beam = getComputedStyle(document.documentElement).getPropertyValue("--beam").trim();

function draw(c, n) {
  const dpr = window.devicePixelRatio || 1, w = 64, h = 52;
  c.width = w * dpr; c.height = h * dpr;
  const g = c.getContext("2d");
  const half = Math.min(w, h) / 2 - 5;
  g.setTransform(dpr * half, 0, 0, dpr * half, dpr * w / 2, dpr * h / 2);
  g.strokeStyle = beam; g.lineCap = "round"; g.lineJoin = "round";
  g.shadowColor = beam; g.shadowBlur = 4 * dpr;
  const pen = (width = 1.6, dash = null) => { g.lineWidth = width / half; g.setLineDash(dash ? dash.map(d => d / half) : []); };
  const DOT = [0.1, 4], FINE = [0.1, 2.4];
  const line = (pts, close) => { g.beginPath(); pts.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y)); if (close) g.closePath(); g.stroke(); };
  const seg = (a, b, c2, d) => line([[a, b], [c2, d]]);
  const ell = (x, y, ww, hh, from = 0, to = 360) => { g.beginPath(); g.ellipse(x + ww / 2, y + hh / 2, ww / 2, hh / 2, 0, from * Math.PI / 180, to * Math.PI / 180); g.stroke(); };
  const rect = (x, y, ww, hh) => line([[x, y], [x + ww, y], [x + ww, y + hh], [x, y + hh]], true);
  const wave = (y, a, periods) => line(Array.from({ length: 41 }, (_, i) => { const t = i / 40; return [-1 + 2 * t, y - a * Math.sin(t * periods * 2 * Math.PI)]; }));
  // Croix creuse (contour seulement), tournee de "turn" radians.
  const cross = (turn) => { const a = .3, b = .9, c0 = Math.cos(turn), s0 = Math.sin(turn);
    const pts = [[-a,-b],[a,-b],[a,-a],[b,-a],[b,a],[a,a],[a,b],[-a,b],[-a,a],[-b,a],[-b,-a],[-a,-a]];
    line(pts.map(([x, y]) => [x * c0 - y * s0, x * s0 + y * c0]), true); };
  // Courbe lisse passant par tous les points (Catmull-Rom).
  const smooth = (p) => { g.beginPath(); g.moveTo(...p[0]);
    for (let i = 0; i < p.length - 1; i++) { const p0 = p[Math.max(i - 1, 0)], p1 = p[i], p2 = p[i + 1], p3 = p[Math.min(i + 2, p.length - 1)];
      g.bezierCurveTo(p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6, p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6, p2[0], p2[1]); }
    g.stroke(); };
  pen();
  switch (n) {
    case 1: ell(-.85, -.85, 1.7, 1.7); break;
    case 2: pen(1.8, DOT); ell(-.85, -.85, 1.7, 1.7); break;
    case 3: line([[0, -.85], [.9, .75], [-.9, .75]], true); break;
    case 4: rect(-.75, -.75, 1.5, 1.5); break;
    case 5: pen(1.8, DOT); rect(-.75, -.75, 1.5, 1.5); break;
    case 6: rect(-.85, -.85, 1.7, 1.7); rect(-.45, -.45, .9, .9); break;
    case 7: cross(0); break;
    case 8: line(Array.from({ length: 10 }, (_, i) => { const r = i % 2 ? .4 : .95, a = -Math.PI / 2 + i * Math.PI / 5; return [r * Math.cos(a), r * Math.sin(a)]; }), true); break;
    case 9: line([[.8, -.8], [-.8, -.8], [-.8, .8], [-.45, .8], [-.45, -.45], [.8, -.45]], true); break;
    case 10: line([[-.9, -.75], [.9, .75], [.9, -.75], [-.9, .75]], true); break;
    case 11: line(Array.from({ length: 80 }, (_, i) => { const t = i / 79, a = -t * 6 * Math.PI; return [.9 * t * Math.cos(a), .9 * t * Math.sin(a)]; })); break;
    case 12: ell(-.95, -.2, .7, 1, -90, 90); ell(.25, -.2, .7, 1, 90, 270); break;
    case 13: smooth([[0, 0], [-.4, -.35], [-.85, -.2], [-.75, .55], [.3, .6], [.9, -.8]]); break;
    case 14: ell(-.9, -.9, 1.8, 1.8, 180, 270); ell(-.9, -.9, 1.8, 1.8, 0, 90); break;
    case 15: wave(-.4, .3, 2); wave(.4, .3, 2); break;
    case 16: wave(0, .3, 2); break;
    case 17: line([[-.95, .7], [0, -.75], [.95, .7]]); break;
    case 18: line([[-.9, -.7], [-.45, .7], [0, -.3], [.45, .7], [.9, -.7]]); break;
    case 19: line([[.6, -.8], [-.6, -.8], [-.6, -.12], [.45, -.12], [.45, .12], [-.6, .12], [-.6, .8], [.6, .8]]); break;
    case 20: seg(-.9, 0, .9, 0); break;
    case 21: for (const x of [-.9, -.18, .54]) seg(x, 0, x + .36, 0); break;
    case 22: seg(-.9, 0, .9, 0); break;
    case 23: seg(-.9, -.3, .9, -.3); seg(-.9, .3, .9, .3); break;
    case 24: seg(-.9, 0, .9, 0); seg(0, -.9, 0, .9); break;
    case 25: seg(-.9, .7, 0, .7); seg(0, -.7, .9, -.7); break;
    case 26: for (const a of [45, 135, 225, 315]) ell(-.85, -.85, 1.7, 1.7, a - 25, a + 25); break;
    case 27: rect(-.9, .3, .5, .5); rect(.4, -.8, .5, .5); break;
    case 28: rect(-.9, -.9, .5, .5); rect(.4, -.9, .5, .5); rect(-.9, .4, .5, .5); rect(.4, .4, .5, .5); break;
    case 29: ell(.05, -.9, .85, .85); break;
    case 30: pen(1.6, FINE); seg(-.9, 0, .9, 0); break;
    case 31: pen(1.6, FINE); ell(-.6, -.3, 1.2, 1, 180, 360); break;
    case 32: pen(1.6, FINE); cross(Math.PI / 4); break;
  }
}

const grid = document.getElementById("grid");
names.forEach((name, i) => {
  const n = i + 1, card = document.createElement("div");
  card.className = "card";
  card.innerHTML = `<span class="num">${n}</span><canvas aria-label="Croquis du motif ${n}"></canvas><span class="name">${name}<span class="dmx">DMX ${i * 8}–${i * 8 + 7}</span></span>`;
  grid.appendChild(card);
  draw(card.querySelector("canvas"), n);
});
</script>
